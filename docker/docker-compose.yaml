services:
  backend:
    image: ganaeld/todo-reminder-backend:latest
    restart: always
    container_name: backend
    ports:
      - "80:80"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - backend_net
      - app_net
    depends_on:
      - db
  
  frontend:
    image: ganaeld/todo-reminder-frontend:latest
    restart: always
    container_name: frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - app_net
    depends_on:
      - backend
  
  db:
    image: postgres
    restart: always
    container_name: db
    ports:
      - "8001:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql

networks:
  backend_net:
    driver: bridge
  app_net:
    driver: bridge

volumes:
  postgres_data:
    name: todo_reminder_db_volume
