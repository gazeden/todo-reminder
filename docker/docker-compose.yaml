services:
  backend:
    image: ganaeld/todo-reminder-backend:0.0.1
    restart: always
    container_name: backend
    ports:
      - "80:80"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - backend_net
    depends_on:
      - db
  
  db:
    image: postgres
    restart: always
    container_name: db
    ports:
      - "8001:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data:
    name: todo_reminder_db_volume
